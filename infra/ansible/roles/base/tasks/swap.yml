---
- name: List active swap devices
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: base_swap_active
  changed_when: false
  check_mode: false

- name: Turn swap off now
  ansible.builtin.command: swapoff -a
  when: base_swap_active.stdout | trim | length > 0
  changed_when: true

- name: Comment out swap entries in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\s]\S*\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
