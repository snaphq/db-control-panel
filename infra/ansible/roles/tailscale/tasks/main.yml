---
# Install method: Tailscale's own apt repository for Debian/Ubuntu
# (https://pkgs.tailscale.com/stable/), the documented alternative to
# `curl | sh` (https://tailscale.com/kb/1031/install-linux).
- name: Assert a supported distribution
  ansible.builtin.assert:
    that: ansible_facts['distribution'] in ['Ubuntu', 'Debian']
    fail_msg: "Only Ubuntu and Debian are supported (found {{ ansible_facts['distribution'] }})"
    quiet: true

- name: Install the Tailscale apt signing key
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_base_url }}/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
    dest: "{{ tailscale_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
  register: tailscale_keyring

- name: Add the Tailscale apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    content: >-
      deb [signed-by={{ tailscale_keyring_path }}]
      {{ tailscale_repo_base_url }}/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} main
    owner: root
    group: root
    mode: "0644"
  register: tailscale_repo

- name: Refresh apt metadata after a repository change
  ansible.builtin.apt:
    update_cache: true
  when: tailscale_keyring is changed or tailscale_repo is changed

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Read the Tailscale backend state
  ansible.builtin.command: tailscale status --json --peers=false
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Interpret the backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{ (tailscale_status.stdout | from_json).BackendState
         if tailscale_status.stdout is match('^\s*\{')
         else 'Unknown' }}

# Only runs when the node is not already logged in and running, so re-runs
# never consume the auth key. --reset makes the flags below the full intended
# configuration (`tailscale up` otherwise refuses to change a configured node
# unless every non-default flag is repeated). The key is briefly visible in
# the process list during this command on the node; use a single-use or
# short-lived key if that matters to you.
- name: Join the tailnet
  ansible.builtin.command:
    argv: >-
      {{ ['tailscale', 'up', '--reset',
          '--auth-key=' ~ tailscale_authkey,
          '--hostname=' ~ tailscale_hostname,
          '--accept-dns=' ~ (tailscale_accept_dns | bool | lower),
          '--timeout=' ~ tailscale_up_timeout]
         + tailscale_up_extra_args }}
  when: tailscale_backend_state != 'Running'
  changed_when: true
  no_log: true

- name: Record the Tailscale IPv4 address and MagicDNS name
  ansible.builtin.include_tasks: ip.yml
