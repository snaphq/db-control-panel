---
# Sets the facts tailscale_ipv4 and tailscale_fqdn (empty when MagicDNS is off).
# Other roles include this file when the facts are not yet set in the play.
- name: Read the Tailscale IPv4 address
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_result
  until: tailscale_ip_result.rc == 0 and (tailscale_ip_result.stdout | trim | length) > 0
  retries: 10
  delay: 3
  changed_when: false
  check_mode: false

- name: Read this node's own Tailscale status
  ansible.builtin.command: tailscale status --json --peers=false
  register: tailscale_self_status
  changed_when: false
  check_mode: false

- name: Set the Tailscale facts
  ansible.builtin.set_fact:
    tailscale_ipv4: "{{ tailscale_ip_result.stdout_lines[0] | trim }}"
    tailscale_fqdn: >-
      {{ ((tailscale_self_status.stdout | from_json).Self.DNSName | default(''))
         | regex_replace('\.$', '') }}
