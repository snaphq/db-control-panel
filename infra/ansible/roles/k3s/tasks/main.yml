---
# Preflight shared by k3s_server and k3s_agent (role dependency).
- name: Validate k3s inputs
  ansible.builtin.assert:
    that:
      - k3s_version is defined
      - k3s_version is match('^v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+$')
      - k3s_token is defined
      - k3s_token | length >= 16
      - public_ip is defined
      - public_ip is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
      - groups['k3s_servers'] | default([]) | length > 0
      - k3s_node_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    fail_msg: >-
      k3s needs k3s_version (like v1.36.4+k3s1), k3s_token (export ALLOYDB_K3S_TOKEN,
      at least 16 characters), a public_ip, at least one host in k3s_servers, and an
      inventory hostname that is a valid Kubernetes node name.
    quiet: true

- name: Resolve the Tailscale IPv4 address
  ansible.builtin.include_role:
    name: tailscale
    tasks_from: ip
  when: tailscale_ipv4 is not defined

- name: Read the first server's Tailscale IPv4 for the join URL
  ansible.builtin.command: tailscale ip -4
  delegate_to: "{{ k3s_first_server }}"
  register: k3s_first_server_ip
  changed_when: false
  check_mode: false
  when:
    - not (k3s_is_first_server | bool)
    - k3s_registration_address | length == 0

- name: Set the address used to join the cluster
  ansible.builtin.set_fact:
    k3s_join_host: >-
      {{ k3s_registration_address
         if k3s_registration_address | length > 0
         else (k3s_first_server_ip.stdout_lines[0] | default('') | trim) }}
  when: not (k3s_is_first_server | bool)
