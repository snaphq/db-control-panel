# Ansible settings for the AlloyDB node playbooks. Run ansible-playbook from
# this directory so the relative paths below resolve. Usage is documented at
# the top of playbooks/site.yml.
[defaults]
# Real inventory is gitignored; start from inventory/hosts.example.yml.
inventory = inventory/hosts.yml
roles_path = roles
# Collections pinned in requirements.yml install into ./collections (gitignored).
collections_path = collections:~/.ansible/collections
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
forks = 10

[ssh_connection]
pipelining = True
