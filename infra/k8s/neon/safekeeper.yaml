# Safekeepers: the durable WAL quorum. Unlike the other storage-plane workloads
# they are NOT declared here: the control-plane worker creates one StatefulSet
# `safekeeper-<id>` (one replica, one local-path PersistentVolume, pinned to a
# node) and one Service `safekeeper-<id>` per safekeeper, so it can spread them
# over nodes as the cluster grows and move one to another node later
# (docs-internal/platform/control-plane.mdx, "Safekeeper layout").
#
# What stays here is what every safekeeper shares:
#   * the headless Service `safekeeper` (pod DNS for the StatefulSets);
#   * the PodDisruptionBudget (below);
#   * the entrypoint script, as ConfigMap `safekeeper-entrypoint`
#     (kustomization.yaml; scripts/safekeeper-entrypoint.sh).
#
# Identity comes from env the worker sets: SAFEKEEPER_ID (--id) and
# SAFEKEEPER_AZ (--availability-zone, `az-<id>`: one logical zone per
# safekeeper, so the controller's distinct-zone rule holds on any node count).
# The registered address is the safekeeper's own Service,
#   safekeeper-<id>.neon.svc.cluster.local, WAL port 5454, HTTP port 7676,
# which survives pod restarts. The worker registers each safekeeper with the
# storage controller (POST /control/v1/safekeeper/<id>, then scheduling policy
# Active) once its pod is Ready.
#
# Local PVs pin a pod to the node that first ran it. If that node is lost the
# replica's WAL is lost with it; the other two safekeepers keep the quorum and
# the replica has to be replaced (runbook in control-plane.mdx).
apiVersion: v1
kind: Service
metadata:
  name: safekeeper
  namespace: neon
  labels:
    app.kubernetes.io/name: safekeeper
    app.kubernetes.io/component: safekeeper
spec:
  clusterIP: None # headless: gives every pod a DNS name
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: safekeeper
  ports:
    - name: pg
      port: 5454
      targetPort: pg
    - name: http
      port: 7676
      targetPort: http
---
# At most one safekeeper may be voluntarily disrupted at a time: with three
# replicas that keeps the 2-of-3 write quorum alive during node drains. It
# selects every safekeeper pod by label, whichever StatefulSet owns it; the
# disruption controller adds up the scale of all owning StatefulSets. The worker
# applies the same rule to its own actions: it rolls an image or moves a
# safekeeper only while every other one is Ready.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: safekeeper
  namespace: neon
  labels:
    app.kubernetes.io/name: safekeeper
    app.kubernetes.io/component: safekeeper
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: safekeeper
