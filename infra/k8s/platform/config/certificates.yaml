# Every certificate comes from letsencrypt-cloudflare (DNS-01).
#
# pg-wildcard-tls sets commonName explicitly: the Neon proxy takes its accepted
# domain from the certificate's subject CN, not from the SANs
# (proxy/src/tls/server_config.rs, CertResolver::process_key_cert).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pg-wildcard-tls
  namespace: neon
spec:
  secretName: pg-wildcard-tls
  commonName: '*.pg.alloydb.net'
  dnsNames:
    - '*.pg.alloydb.net'
  privateKey:
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-cloudflare
---
