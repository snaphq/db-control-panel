# Flux Kustomization `monitoring-controllers`: the VictoriaMetrics operator, its
# CRDs and the metrics stack. Split from ../config because the scrape and rule
# objects there need the operator's CRDs to exist first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helm-repository.yaml
  - victoria-metrics-k8s-stack.yaml
