# victoria-metrics-k8s-stack chart 0.95.0 / app v1.153.0, published 2026-09-28
# (index https://victoriametrics.github.io/helm-charts/index.yaml; values read
# from the chart's values.yaml at that version). Chosen over kube-prometheus-stack
# for its smaller footprint on a single node: VMSingle, VMAgent, VMAlert and
# Alertmanager, kube-state-metrics and node-exporter, no Grafana.
#
# UIs (nothing is exposed publicly; use port-forward, see
# docs-internal/operations/monitoring.mdx): vmsingle :8428/vmui, vmalert :8080,
# alertmanager :9093.
#
# Alertmanager reads its whole config from the Secret `alertmanager-config`
# (key alertmanager.yaml) that infra/scripts/render-secrets.ts renders; with
# ALLOYDB_ALERT_WEBHOOK_URL unset it only has a null receiver, so alerts are
# visible in the UIs and nowhere else.
#
# k3s runs the controller manager, scheduler and etcd inside the k3s process,
# so their scrapes are off. The operator CRDs (plain `crds/`
# directory) are only installed by Helm on first install, so Flux must create
# and replace them itself.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: flux-system
spec:
  interval: 1h
  releaseName: vm
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.95.0
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Short object names: vmsingle-vm, vmalert-vm, vmalertmanager-vm, vmagent-vm.
    fullnameOverride: vm
    victoria-metrics-operator:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
    defaultDashboards:
      enabled: false
    grafana:
      enabled: false
    vmsingle:
      spec:
        retentionPeriod: 15d
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        storage:
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
    vmagent:
      spec:
        scrapeInterval: 30s
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
    vmalert:
      spec:
        evaluationInterval: 30s
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
    alertmanager:
      spec:
        configSecret: alertmanager-config
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 192Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          memory: 96Mi
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    # Chart 0.95.0 builds its default Kubernetes/VM rules with a Job that downloads
    # them from upstream `main` branches at deploy time, which is neither
    # reproducible nor needed here. The alerts this platform relies on are our own
    # VMRule in infra/k8s/monitoring/config/rules.yaml.
    defaultRules:
      enabled: false
    syncJob:
      enabled: false
