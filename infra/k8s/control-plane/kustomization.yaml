# AlloyDB control plane (namespace `alloydb-system`): one image, four
# Deployments selected by ALLOYDB_MODE (api, neon-glue, worker,
# data-api-gateway). Contract: docs-internal/platform/control-plane.mdx and
# docs-internal/platform/architecture.mdx. Image: infra/images/control-plane.
#
# The namespaces `alloydb-system`, `neon-compute`, and `libsql` are owned by
# infra/k8s/platform and are not created here.
#
# Build:   kustomize build infra/k8s/control-plane
# Image:   set the tag first, e.g.
#            kustomize edit set image ghcr.io/snaphq/alloydb-control-plane=ghcr.io/snaphq/alloydb-control-plane:<TAG>
#          Pinned to the images.yml build of that commit; bump it after each green build.
#
# Compute images: the control plane creates compute pods itself, so their images
#          are settings, not container images kustomize could rewrite. They come
#          from the `control-plane-images` ConfigMap below (ALLOYDB_COMPUTE_IMAGE,
#          ALLOYDB_POSTGREST_IMAGE, ALLOYDB_NEON_IMAGE) that worker, neon-glue and data-api-gateway
#          load with envFrom. Replace the placeholder tags with the commit the
#          images workflow built (neon-compute-v17:<sha>, postgrest:<sha>).
#
# ---------------------------------------------------------------------------
# Secrets this kustomization expects in namespace `alloydb-system`.
# None are in Git; infra/scripts/render-secrets.ts creates them from .env.local
# and cert-manager issues the TLS Secrets (infra/k8s/platform/config/certificates.yaml).
# Key names follow render-secrets.ts.
#
#   control-plane-db         DATABASE_URL  postgresql://.../control_plane on the platform Postgres
#
#   control-plane-data       ALLOYDB_DATA_KEY  AES-256 key (32 bytes, base64) that seals stored role
#                            passwords and the Data API signing key. Every mode needs it.
#
#   control-plane-api        ALLOYDB_API_TOKEN  bearer token the console server presents to the
#                            api mode on the org-scoped /v1 routes. The console holds
#                            the same value.
#                            ALLOYDB_ADMIN_API_TOKEN  bearer token the platform admin
#                            portal (apps/backend) presents on /v1/admin/*. Must differ
#                            from ALLOYDB_API_TOKEN; each token unlocks only its own half.
#
#   neon-jwt                 Ed25519 key material for every Neon token
#     private.pem              PKCS#8 PEM private key. Mounted as a file at
#                              /etc/alloydb/neon-jwt/private.pem (NEON_JWT_PRIVATE_KEY_PATH).
#     CONTROL_PLANE_JWT_TOKEN  JWT, scope admin: sent to the storage controller and
#                              expected on its /storcon/notify-* calls
#     (the same Secret also carries public.pem and the pageserver, safekeeper and
#      generations tokens; this kustomization does not read them)
#
#   neon-proxy-token         NEON_PROXY_TO_CONTROLPLANE_TOKEN  bearer the Neon proxy presents on /proxy/*
#
#   libsql-admin             LIBSQL_ADMIN_AUTH_KEY  sqld admin API key
#
#   libsql-jwt-signing       private.pem  PKCS#8 PEM private key that signs per-database sqld
#                            tokens. Mounted at /etc/alloydb/libsql-jwt/private.pem
#                            (LIBSQL_JWT_SIGNING_KEY_PATH).
#
#   api-tls                  kubernetes.io/tls for api.alloydb.net (cert-manager)
#   apirest-wildcard-tls     kubernetes.io/tls for *.apirest.alloydb.net (cert-manager)
#
#   ghcr-pull (optional)     dockerconfigjson, only while ghcr.io/snaphq packages are private.
#                            Needed in alloydb-system for the control-plane pods and in
#                            neon-compute for the compute pods. Compute pods name it in
#                            imagePullSecrets; if it does not exist Kubernetes only logs a
#                            warning and pulls anonymously. ALLOYDB_IMAGE_PULL_SECRET=none
#                            leaves it out of the pod spec.
# ---------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - api.yaml
  - neon-glue.yaml
  - worker.yaml
  - data-api-gateway.yaml
  - ingress.yaml
  - compute-networkpolicy.yaml

# kustomize adds a content hash to the name and rewrites the envFrom references,
# so changing an image rolls the three modes that read it.
configMapGenerator:
  - name: control-plane-images
    # Without the namespace kustomize cannot match the generated name to the
    # envFrom references in alloydb-system, and leaves them without the hash.
    namespace: alloydb-system
    literals:
      - ALLOYDB_COMPUTE_IMAGE=ghcr.io/snaphq/neon-compute-v17:d6351a43335885c377f7cb0d8dd5635a1f68eb38
      - ALLOYDB_POSTGREST_IMAGE=ghcr.io/snaphq/postgrest:d6351a43335885c377f7cb0d8dd5635a1f68eb38
      # The safekeeper pods the worker creates. Keep in step with the
      # ghcr.io/snaphq/neon tag in infra/k8s/neon/kustomization.yaml; changing it
      # makes the worker roll the safekeepers, one at a time.
      - ALLOYDB_NEON_IMAGE=ghcr.io/snaphq/neon:d6351a43335885c377f7cb0d8dd5635a1f68eb38

images:
  - name: ghcr.io/snaphq/alloydb-control-plane
    newTag: d6351a43335885c377f7cb0d8dd5635a1f68eb38

# Labels go on every object and on pod templates, but not on selectors
# (includeSelectors: false), so selectors stay stable if this label changes.
labels:
  - pairs:
      app.kubernetes.io/part-of: alloydb
    includeSelectors: false
    includeTemplates: true
