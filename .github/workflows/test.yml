name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'sites/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'sites/**'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # The control plane's integration suites (queue, operation repository,
    # Drizzle stores, API isolation) skip themselves without a database.
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CONTROL_PLANE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/control_plane_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run tests
        run: bunx turbo run test --filter='./packages/*' --filter='./apps/*' --filter='./sites/*'
