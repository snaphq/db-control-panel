name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'sites/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'sites/**'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run tests
        run: bunx turbo run test --filter='./packages/*'
