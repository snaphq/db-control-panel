name: Images

# Builds every AlloyDB data-plane image from pinned snaphq source mirrors
# (infra/images/sources.env) and pushes it to ghcr.io/snaphq. Nothing here
# pulls an image built by Neon or Turso; third-party base images (debian,
# rust, haskell) come from Docker Hub.

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated images to build (or "all")'
        required: false
        default: all
  push:
    branches: [main]
    paths:
      - 'infra/images/**'
      - '.github/workflows/images.yml'

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/snaphq

jobs:
  pins:
    runs-on: ubuntu-latest
    outputs:
      neon_repo: ${{ steps.pins.outputs.NEON_REPO }}
      neon_ref: ${{ steps.pins.outputs.NEON_REF }}
      pg_version: ${{ steps.pins.outputs.PG_VERSION }}
      libsql_repo: ${{ steps.pins.outputs.LIBSQL_REPO }}
      libsql_ref: ${{ steps.pins.outputs.LIBSQL_REF }}
      postgrest_repo: ${{ steps.pins.outputs.POSTGREST_REPO }}
      postgrest_ref: ${{ steps.pins.outputs.POSTGREST_REF }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: Read pinned sources
        run: grep -E '^[A-Z_]+=' infra/images/sources.env >> "$GITHUB_OUTPUT"
      - id: select
        name: Resolve selected images
        env:
          REQUESTED: ${{ github.event.inputs.images || 'all' }}
        run: echo "selected=,${REQUESTED// /}," >> "$GITHUB_OUTPUT"

  neon-build-tools:
    needs: pins
    if: contains(needs.pins.outputs.selected, ',all,') || contains(needs.pins.outputs.selected, ',neon-build-tools,') || contains(needs.pins.outputs.selected, ',neon-storage,')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.pins.outputs.neon_repo }}
          ref: ${{ needs.pins.outputs.neon_ref }}
      - id: tag
        run: echo "tag=${NEON_REF::12}-bookworm" >> "$GITHUB_OUTPUT"
        env:
          NEON_REF: ${{ needs.pins.outputs.neon_ref }}
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build-tools/Dockerfile
          build-args: DEBIAN_VERSION=bookworm
          push: true
          tags: ${{ env.REGISTRY }}/neon-build-tools:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/neon-build-tools:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/neon-build-tools:buildcache,mode=max

  neon-storage:
    needs: [pins, neon-build-tools]
    if: contains(needs.pins.outputs.selected, ',all,') || contains(needs.pins.outputs.selected, ',neon-storage,')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.pins.outputs.neon_repo }}
          ref: ${{ needs.pins.outputs.neon_ref }}
          submodules: true
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
        with:
          # Each Dockerfile stage already runs make -j$(nproc).
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # No SUBZERO_ACCESS_TOKEN secret: the private rest_broker feature stays off.
          build-args: |
            REPOSITORY=${{ env.REGISTRY }}
            IMAGE=neon-build-tools
            TAG=${{ needs.neon-build-tools.outputs.tag }}
            DEBIAN_VERSION=bookworm
            GIT_VERSION=${{ needs.pins.outputs.neon_ref }}
            BUILD_TAG=alloydb-${{ github.run_number }}
          push: true
          tags: ${{ env.REGISTRY }}/neon:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/neon:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/neon:buildcache,mode=max

  neon-compute:
    needs: pins
    if: contains(needs.pins.outputs.selected, ',all,') || contains(needs.pins.outputs.selected, ',neon-compute,')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloydb
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.pins.outputs.neon_repo }}
          ref: ${{ needs.pins.outputs.neon_ref }}
          path: neon
      - name: Check out the Postgres submodule for this version only
        working-directory: neon
        run: git submodule update --init --depth 1 vendor/postgres-${{ needs.pins.outputs.pg_version }}
      - name: Add the AlloyDB extension set
        working-directory: neon
        run: git apply ../alloydb/infra/images/neon-compute/extensions-alloydb.patch
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: neon
          file: neon/compute/compute-node.Dockerfile
          build-args: |
            PG_VERSION=${{ needs.pins.outputs.pg_version }}
            DEBIAN_VERSION=bookworm
            EXTENSIONS=alloydb
            BUILD_TAG=alloydb-${{ github.run_number }}
          push: true
          tags: ${{ env.REGISTRY }}/neon-compute-${{ needs.pins.outputs.pg_version }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/neon-compute-${{ needs.pins.outputs.pg_version }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/neon-compute-${{ needs.pins.outputs.pg_version }}:buildcache,mode=max

  libsql-server:
    needs: pins
    if: contains(needs.pins.outputs.selected, ',all,') || contains(needs.pins.outputs.selected, ',libsql-server,')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloydb
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.pins.outputs.libsql_repo }}
          ref: ${{ needs.pins.outputs.libsql_ref }}
          path: libsql
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: libsql
          file: alloydb/infra/images/libsql-server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/libsql-server:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/libsql-server:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/libsql-server:buildcache,mode=max

  postgrest:
    needs: pins
    if: contains(needs.pins.outputs.selected, ',all,') || contains(needs.pins.outputs.selected, ',postgrest,')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloydb
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.pins.outputs.postgrest_repo }}
          ref: ${{ needs.pins.outputs.postgrest_ref }}
          path: postgrest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: postgrest
          file: alloydb/infra/images/postgrest/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/postgrest:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/postgrest:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/postgrest:buildcache,mode=max
