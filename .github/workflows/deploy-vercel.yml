name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  # Applies the web-app database migrations (packages/database/drizzle) before
  # any app is deployed, so new code never meets an old schema. The job needs
  # the repository secret DATABASE_URL; without it every step except the notice
  # is skipped, the job still succeeds and the deploy proceeds unchanged. A
  # failed migration fails the job and blocks the deploy.
  # First use on a database created with `db:push`: run `db:baseline` once
  # (docs-internal/operations/migrations.mdx).
  migrate:
    runs-on: ubuntu-latest
    name: migrate (web-app database)
    permissions:
      contents: read
    concurrency:
      group: web-app-db-migrate
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET_ENVIRONMENT: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')) && 'production' || 'preview' }}
    steps:
      - name: Decide whether to migrate
        id: gate
        run: |
          if [ "$TARGET_ENVIRONMENT" != "production" ]; then
            echo "::notice title=Migrations skipped::Only production runs migrate the repository DATABASE_URL database; this is a $TARGET_ENVIRONMENT run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$DATABASE_URL" ]; then
            echo "::notice title=Migrations skipped::The DATABASE_URL repository secret is not set. Add it under Settings > Secrets and variables > Actions to apply database migrations before each deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Bun
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply migrations
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: bun run --filter @repo/database db:migrate

      - name: Explain a failed migration
        if: ${{ failure() && steps.gate.outputs.run == 'true' }}
        run: |
          echo "::error title=Migration failed::Nothing was deployed. If the database was created with db:push (no drizzle.__drizzle_migrations table), run db:baseline once; see docs-internal/operations/migrations.mdx."

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    name: deploy (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        # One Vercel project per app, with hard-coded project ids (and the org
        # id below); rows with an empty project_id are skipped.
        # setup:start
        # Written during setup by .agents/skills/setup/scripts/set-vercel-projects.ts.
        # setup:end
        # sites/net.alloydb.console deploys from the repository root (root
        # vercel.json); apps/backend uses the vercel.json in its own folder as
        # the project Root Directory.
        include:
          - app: alloydb.console
            project_id: 'prj_TSfaxTFNY4iHJ9wdHA7CdncEa96q'
            project_name: 'alloydb-console'
            node_version: '22'
          - app: backend
            project_id: 'prj_OFRUUVYdouxmzSDyrjF3UKqW1CNg'
            project_name: 'alloydb-admin'
            node_version: '22'
    environment:
      name: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')) && 'production' || 'preview' }}

    steps:
      - name: Checkout code
        if: ${{ matrix.project_id != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel
        if: ${{ matrix.project_id != '' }}
        uses: W3Dev/vercel-deploy@main
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: 'team_bhbVYR6BqVYMXKwAp7F1k5ib'
          vercel_project_id: ${{ matrix.project_id }}
          vercel_project_name: ${{ matrix.project_name }}
          package_manager: 'bun'
          node_version: ${{ matrix.node_version }}
          deploy_args: '--archive=tgz'
          environment: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')) && 'production' || 'preview' }}
          prebuild_script: |
            git config --global user.email "ashutosh@w3dev.in"
            git config --global user.name "Ashutosh"
            git commit --amend --no-edit --author="Ashutosh <ashutosh@w3dev.in>"
