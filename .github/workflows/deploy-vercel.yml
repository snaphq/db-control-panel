name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: deploy (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        # One Vercel project per app, with hard-coded project ids (and the org
        # id below); rows with an empty project_id are skipped.
        # setup:start
        # Written during setup by .agents/skills/setup/scripts/set-vercel-projects.ts.
        # setup:end
        # sites/net.alloydb.console deploys from the repository root (root
        # vercel.json); apps/backend uses the vercel.json in its own folder as
        # the project Root Directory.
        include:
          - app: alloydb.console
            project_id: ''
            project_name: 'nexvio-ai'
            node_version: '22'
          - app: backend
            project_id: ''
            project_name: 'backend'
            node_version: '22'
    environment:
      name: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')) && 'production' || 'preview' }}

    steps:
      - name: Checkout code
        if: ${{ matrix.project_id != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel
        if: ${{ matrix.project_id != '' }}
        uses: W3Dev/vercel-deploy@main
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: 'team_M1i3qUTW4i3A6mETy54E1Fy8'
          vercel_project_id: ${{ matrix.project_id }}
          vercel_project_name: ${{ matrix.project_name }}
          package_manager: 'bun'
          node_version: ${{ matrix.node_version }}
          deploy_args: '--archive=tgz'
          environment: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')) && 'production' || 'preview' }}
          prebuild_script: |
            git config --global user.email "ashutosh@w3dev.in"
            git config --global user.name "Ashutosh"
            git commit --amend --no-edit --author="Ashutosh <ashutosh@w3dev.in>"
