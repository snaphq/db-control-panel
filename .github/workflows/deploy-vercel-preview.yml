name: Deploy to Vercel - Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/**'
      - 'sites/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-vercel-preview.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy'
        required: false
        type: string

concurrency:
  group: preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write
  issues: write

jobs:
  deploy-preview:
    runs-on: self-hosted
    name: deploy-preview (${{ matrix.app }})
    strategy:
      fail-fast: false
      matrix:
        # Same app list as deploy-vercel.yml; apps without a project id skip.
        include:
          - app: site-a
            project_id_var: VERCEL_PROJECT_ID_SITE_A
            default_project_id: 'prj_YLF5HawHAOzh4oKqS8wmxoBZ9hU5'
            project_name: 'nexvio-ai'
            alias_prefix: 'nexvio-ai'
            node_version: '22'
          - app: site-b
            project_id_var: VERCEL_PROJECT_ID_SITE_B
            default_project_id: ''
            project_name: 'site-b'
            alias_prefix: 'nextjs-starter-kit-site-b'
            node_version: '22'
          - app: backend
            project_id_var: VERCEL_PROJECT_ID_BACKEND
            default_project_id: ''
            project_name: 'backend'
            alias_prefix: 'nextjs-starter-kit-backend'
            node_version: '22'
          # SolidStart 2 requires Node 24+, so this row must not inherit 22.
          - app: site-c
            project_id_var: VERCEL_PROJECT_ID_SITE_C
            default_project_id: 'prj_Kyj2GxV8oZGiwweHbVasBwvtinqZ'
            project_name: 'starter-solid-stack'
            alias_prefix: 'starter-solid-stack'
            node_version: '24'
    if: >
      github.event_name != 'pull_request' ||
      (!startsWith(github.event.pull_request.title, 'WIP') &&
       !startsWith(github.event.pull_request.title, 'wip') &&
       !startsWith(github.event.pull_request.title, '[WIP]') &&
       !startsWith(github.event.pull_request.title, '[wip]'))
    environment:
      name: preview

    steps:
      - name: Checkout code
        if: ${{ vars[matrix.project_id_var] != '' || matrix.default_project_id != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Vercel
        if: ${{ vars[matrix.project_id_var] != '' || matrix.default_project_id != '' }}
        uses: W3Dev/vercel-deploy@main
        with:
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_org_id: ${{ vars.VERCEL_ORG_ID || 'team_M1i3qUTW4i3A6mETy54E1Fy8' }}
          vercel_project_id: ${{ vars[matrix.project_id_var] || matrix.default_project_id }}
          vercel_project_name: ${{ matrix.project_name }}
          package_manager: 'bun'
          node_version: ${{ matrix.node_version }}
          deploy_args: '--archive=tgz'
          alias_prefix: ${{ matrix.alias_prefix }}
          environment: 'preview'
          prebuild_script: |
            git config --global user.email "ashutosh@w3dev.in"
            git config --global user.name "Ashutosh"
            git commit --amend --no-edit --author="Ashutosh <ashutosh@w3dev.in>"
